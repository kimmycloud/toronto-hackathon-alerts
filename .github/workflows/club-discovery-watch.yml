name: University Club Discovery Watch

on:
  schedule:
    - cron: "17 0,12 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: club-discovery-watch
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run university club discovery watch
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python club_discovery_watch.py \
            | tee club-discovery-output.txt

      - name: Report monitor health
        if: always()
        env:
          MONITOR_ERROR_WEBHOOK_URL: ${{ secrets.MONITOR_ERROR_WEBHOOK_URL }}
        run: |
          if [ -f club-discovery-output.txt ]; then
            python monitor_health.py \
              --type club-discovery \
              --file club-discovery-output.txt
          else
            echo "Club discovery output file was not created."
          fi

      - name: Save monitor states
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            club_discovery_state.json \
            monitor_health_state.json

          if git diff --cached --quiet; then
            echo "No monitor state changes to save."
          else
            git commit -m "Update club discovery monitor state"
            git pull --rebase origin main
            git push origin main
          fi
