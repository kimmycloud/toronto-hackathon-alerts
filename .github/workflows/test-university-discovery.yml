name: Test University Discovery

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install "lxml>=5,<7"

      - name: Run university discovery
        run: |
          python discover.py > university-events.json
          echo "===== RESULTS ====="
          python -m json.tool university-events.json
