name: Run Hackathon Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "17 0,6,12,18 * * *"
      timezone: "America/Toronto"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python hackathon_monitor.py

      - name: Check reminders
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python hackathon_reminders.py

      - name: Save alert history
        run: |
          git config user.name "hackathon-alert-bot"
          git config user.email "actions@github.com"
          git add sent_hackathons.json

          if [ -f reminder_history.json ]; then
            git add reminder_history.json
          fi

          if git diff --cached --quiet; then
            echo "No new alerts to save."
          else
            git commit -m "Update hackathon alert history"
            git push
          fi
