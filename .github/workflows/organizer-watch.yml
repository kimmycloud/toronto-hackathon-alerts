name: Annual Organizer Watch

on:
  schedule:
    # Once per day.
    # Annual organizer sites are cheap to check,
    # and daily gives us earlier notice than weekly.
    - cron: "37 13 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: organizer-watch
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run annual organizer watch
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python annual_organizer_watch.py

      - name: Save organizer state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add organizer_state.json

          if git diff --cached --quiet; then
            echo "No organizer state changes to save."
          else
            git commit -m "Update organizer monitor state"

            git pull --rebase origin main
            git push origin main
          fi
