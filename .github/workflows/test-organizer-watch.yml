name: Test Organizer Watch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run organizer watch
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python annual_organizer_watch.py

      - name: Show organizer state
        run: cat organizer_state.json

      - name: Save organizer state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add organizer_state.json

          if git diff --cached --quiet; then
            echo "No organizer state changes to save."
          else
            git commit -m "Update organizer monitor state"
            git push
          fi
